  <body>

  <!-- === KODE CHATBOT MOODLAB: MULAI === -->
<style>
    #chat-container  {
        position : fixed;
        bottom: 20px ;
        right: 20px ;
        width: 350px ;
        max-width: 90% ;
        height: 500px ;
        max-height: 80vh ;
        border-radius: 15px ;
        display : flex;
        flex-direction : column;
        overflow : hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15 );
        font-family : Arial, sans-serif;
        background: #ffffff ;
        z-index: 1000 ;
    }
    #chat-header  {
        background: linear-gradient(90deg, #4b6cb7 0%, #182848 100% );
        color : white;
        padding: 15px ;
        text-align : center;
        font-weight : bold;
        font-size: 1.1em ;
    }
    #chat-messages  {
        flex-grow: 1 ;
        padding: 15px ;
        overflow-y : auto;
        display : flex;
        flex-direction : column;
        gap: 12px ;
    }
    .message  {
        padding: 10px 15px ;
        border-radius: 20px ;
        max-width: 85% ;
        line-height: 1.5 ;
    }
    .user-message  {
        background-color: #e1f5fe ;
        align-self : flex-end;
        border-bottom-right-radius: 5px ;
    }
    .bot-message  {
        background-color: #f1f3f4 ;
        align-self : flex-start;
        border-bottom-left-radius: 5px ;
    }
    #chat-input-form  {
        display : flex;
        border-top: 1px solid #e0e0e0 ;
        padding: 10px ;
        background: #f9f9f9 ;
    }
    #chat-input  {
        flex-grow: 1 ;
        border: 1px solid #ddd ;
        border-radius: 20px ;
        padding: 10px 15px ;
        font-size: 1em ;
        outline : none;
    }
    #chat-input:focus  {
        border-color: #4b6cb7 ;
    }
    #chat-submit  {
        background: #4b6cb7 ;
        color : white;
        border : none;
        border-radius: 50% ;
        width: 40px ;
        height: 40px ;
        margin-left: 10px ;
        cursor : pointer;
        font-size: 18px ;
        transition: background-color 0.3s ;
    }
    #chat-submit:hover  {
        background: #182848 ;
    }
</style>

<div id="chat-container">
    <div id="chat-header">MoodLab Assistant</div>
    <div id="chat-messages">
        <div class="message bot-message">Halo! Ada yang bisa saya bantu hari ini?</div>
    </div>
    <form id="chat-input-form">
        <input type="text" id="chat-input" placeholder="Ketik pesan Anda..." autocomplete="off" required>
        <button type="submit" id="chat-submit">&#10148;</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () =>  {
        const chatMessages = document.getElementById('chat-messages' );
        const chatInputForm = document.getElementById('chat-input-form' );
        const chatInput = document.getElementById('chat-input' );
        
        // !!! PENTING: URL PRODUKSI N8N ANDA !!!
        const BACKEND_URL = 'https://c5ohjz6c.bocindonesia.com/webhook/a76b432a-e3dd-4290-b467-8bab092456f0' ;

        // Buat ID unik untuk sesi chat pengguna ini.
        // ID ini akan tetap sama selama pengguna berada di halaman.
        const sessionId = 'moodlab-user-' + Date .now();

        // Fungsi untuk menambahkan pesan ke tampilan chat
        function addMessage(sender, text) {
            const messageElement = document.createElement('div' );
            messageElement.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message' );
            messageElement.textContent = text;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll ke bawah
        }

        // Kirim pesan saat form disubmit
        chatInputForm.addEventListener('submit', async  (event) => {
            event.preventDefault();
            const  userMessage = chatInput.value.trim();

            if (userMessage === '') return ;

            addMessage('user' , userMessage);
            chatInput.value = ''; // Kosongkan input

            try  {
                // Kirim pesan dan sessionId ke n8n
                const response = await  fetch(BACKEND_URL, {
                    method: 'POST' ,
                    headers: { 'Content-Type': 'application/json'  },
                    body: JSON .stringify({
                        message : userMessage,
                        sessionId : sessionId
                    }),
                });

                if  (!response.ok) {
                    throw new Error(`Server error: ${response.status}` );
                }

                const data = await  response.json();
                
                // Ambil balasan dari AI. Pastikan field sesuai output AI Agent di n8n.
                const botReply = data.response || data.text || "Maaf, saya tidak mengerti." ;

                addMessage('bot' , botReply);

            } catch  (error) {
                console.error('Error saat menghubungi chatbot:' , error);
                addMessage('bot', 'Oops, sepertinya ada masalah koneksi. Coba lagi nanti ya.' );
            }
        });
    });
</script>
<!-- === KODE CHATBOT MOODLAB: SELESAI === -->
